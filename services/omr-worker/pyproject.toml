[project]
name = "omr-worker"
version = "0.0.1"
description = "OMR worker: PDF/фото нот → MusicXML"
requires-python = ">=3.11,<3.13"  # homr/onnxruntime: проверить совместимость перед повышением
dependencies = [
    "bullmq",
    "boto3",
    "pydantic>=2",
    "numpy",
    "pymupdf",
    "opencv-python-headless",
    "music21",       # разбор MusicXML для проверки тактов
    "pillow",
    "pillow-heif",   # HEIC с iPhone
    "psutil",        # остановка homr вместе с дочерними процессами
    # homr ставится в отдельное окружение (конфликт зависимостей), путь — OMR_HOMR_EXE
]

[project.scripts]
omr-worker = "omr_worker.main:main"

[dependency-groups]
dev = ["pytest", "ruff"]
# Бенчмарк движков OMR (bench/), в прод-образ не попадает. Сами движки живут в своих venv.
bench = ["verovio", "resvg-py", "musicdiff", "pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omr_worker"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src", "."]
