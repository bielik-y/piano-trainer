[project]
name = "omr-worker"
version = "0.0.1"
description = "OMR worker: PDF/фото нот → MusicXML + bbox тактов"
requires-python = ">=3.11,<3.13"  # oemer/onnxruntime: проверить совместимость перед повышением
dependencies = [
    "bullmq",
    "boto3",
    "pydantic>=2",
    "pymupdf",
    "opencv-python-headless",
    # "oemer",  # подключается в фазе 7, тянет onnxruntime
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omr_worker"]

[tool.ruff]
line-length = 100
